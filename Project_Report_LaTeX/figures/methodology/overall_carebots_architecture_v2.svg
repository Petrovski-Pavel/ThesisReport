<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 19px Arial, sans-serif; fill: #374151; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; rx: 14; ry: 14; }
      .blue { fill: #e8f1ff; }
      .green { fill: #eaf7ea; }
      .orange { fill: #fff1df; }
      .purple { fill: #f3ebff; }
      .note { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; rx: 12; ry: 12; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#111827"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="1340" height="380" class="panel"/>
  <rect x="30" y="470" width="1340" height="370" class="panel"/>

  <text x="60" y="72" class="title">Overall Perception Architecture</text>
  <text x="60" y="107" class="subtitle">Training and data-improvement side</text>
  <text x="60" y="507" class="subtitle">Deployment side on the robot</text>

  <!-- Top row -->
  <rect x="70" y="150" width="220" height="92" class="box blue"/>
  <text x="180" y="184" text-anchor="middle" class="label">Elevator-panel dataset</text>
  <text x="180" y="208" text-anchor="middle" class="small">IRSO2018 images + XML labels</text>

  <rect x="360" y="150" width="250" height="92" class="box green"/>
  <text x="485" y="184" text-anchor="middle" class="label">Annotation workflow</text>
  <text x="485" y="208" text-anchor="middle" class="small">CVAT + Mask R-CNN pre-annotation</text>

  <rect x="680" y="150" width="250" height="92" class="box orange"/>
  <text x="805" y="184" text-anchor="middle" class="label">Prepared training data</text>
  <text x="805" y="208" text-anchor="middle" class="small">COCO masks and YOLO labels</text>

  <rect x="1000" y="98" width="300" height="78" class="box purple"/>
  <text x="1150" y="132" text-anchor="middle" class="label">YOLOv8-Seg training and tuning</text>
  <text x="1150" y="155" text-anchor="middle" class="small">baseline, staged tuning, ADC fine-tuning</text>

  <rect x="1000" y="200" width="300" height="78" class="box purple"/>
  <text x="1150" y="234" text-anchor="middle" class="label">OCR training and tuning</text>
  <text x="1150" y="257" text-anchor="middle" class="small">cropped-button recognition model</text>

  <rect x="1000" y="302" width="300" height="72" class="box purple"/>
  <text x="1150" y="335" text-anchor="middle" class="label">Export for deployment</text>
  <text x="1150" y="358" text-anchor="middle" class="small">PyTorch → ONNX → TensorRT engines</text>

  <line x1="290" y1="196" x2="360" y2="196" class="arrow"/>
  <line x1="610" y1="196" x2="680" y2="196" class="arrow"/>
  <line x1="930" y1="196" x2="1000" y2="137" class="arrow"/>
  <line x1="930" y1="196" x2="1000" y2="239" class="arrow"/>
  <line x1="1150" y1="176" x2="1150" y2="200" class="arrow"/>
  <line x1="1150" y1="278" x2="1150" y2="302" class="arrow"/>

  <!-- Middle note -->
  <rect x="500" y="405" width="400" height="64" class="note"/>
  <text x="700" y="431" text-anchor="middle" class="small">Deployment feedback loop</text>
  <text x="700" y="453" text-anchor="middle" class="small">new environment-specific images → review → retraining</text>
  
<path d="M 1150 374 L 1150 515 L 765 515" class="arrow"/>
<path d="M 765 515 L 600 515 L 600 545" class="arrow"/>
<path d="M 765 515 L 930 515 L 930 545" class="arrow"/>




  <!-- Bottom row -->
  <rect x="80" y="565" width="250" height="92" class="box blue"/>
  <text x="205" y="599" text-anchor="middle" class="label">ZED X RGB-D camera</text>
  <text x="205" y="623" text-anchor="middle" class="small">color, depth, calibration topics</text>

  <rect x="405" y="545" width="260" height="118" class="box green"/>
  <text x="535" y="582" text-anchor="middle" class="label">YOLO TensorRT node</text>
  <text x="535" y="607" text-anchor="middle" class="small">instance masks, boxes, 3D targets</text>
  <text x="535" y="630" text-anchor="middle" class="small">debug image output</text>

  <rect x="735" y="545" width="260" height="118" class="box orange"/>
  <text x="865" y="582" text-anchor="middle" class="label">OCR TensorRT node</text>
  <text x="865" y="607" text-anchor="middle" class="small">recognized text + confidence</text>
  <text x="865" y="630" text-anchor="middle" class="small">debug image output</text>

  <rect x="1065" y="545" width="250" height="118" class="box purple"/>
  <text x="1190" y="582" text-anchor="middle" class="label">Active Data Collector</text>
  <text x="1190" y="607" text-anchor="middle" class="small">quality gates, COCO export,</text>
  <text x="1190" y="630" text-anchor="middle" class="small">session metadata</text>

  <rect x="370" y="720" width="690" height="84" class="box"/>
  <text x="715" y="752" text-anchor="middle" class="label">ROS 2 message flow</text>
  <text x="715" y="777" text-anchor="middle" class="small">button targets enriched with geometry and recognized text</text>
  <text x="715" y="797" text-anchor="middle" class="small">used for runtime interaction and selective deployment-data collection</text>

  <line x1="330" y1="611" x2="405" y2="611" class="arrow"/>
  <line x1="665" y1="611" x2="735" y2="611" class="arrow"/>
  <line x1="995" y1="611" x2="1065" y2="611" class="arrow"/>
  <line x1="535" y1="663" x2="535" y2="720" class="arrow"/>
  <line x1="865" y1="663" x2="865" y2="720" class="arrow"/>

  <!-- Feedback loop -->
  <path d="M 1315 611 L 1340 611 L 1340 500 L 700 500 L 700 469" class="arrow dashed"/>
  <path d="M 700 405 L 700 280 L 485 280 L 485 242" class="arrow dashed"/>

</svg>
